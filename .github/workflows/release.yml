name: Release

# On a version tag: build and test once, package one .vsix per Mac target, record checksums and
# build provenance, then (after the maintainer approves the "release" environment) publish the same
# files to the VS Code Marketplace and Open VSX with Trusted Publishing, and to GitHub Releases.
# See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm run test:webview
      - run: npm run test:integration
      - run: npm run package
      - name: Checksums
        run: cd out/packages && shasum -a 256 *.vsix > SHA256SUMS && cat SHA256SUMS
      - run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > out/packages/NOTES.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/packages/*.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/packages/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out/packages
      - name: Pre-release or release
        id: kind
        run: |
          minor=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f2)
          if [ $((minor % 2)) -eq 1 ]; then echo "flag=--pre-release" >> "$GITHUB_OUTPUT"; echo "gh=--prerelease" >> "$GITHUB_OUTPUT"; fi
      - name: VS Code Marketplace
        if: vars.PUBLISH_VSCODE == 'true'
        run: for f in out/packages/*.vsix; do npx --yes @vscode/vsce@4.1.0 publish --packagePath "$f" --oidc ${{ steps.kind.outputs.flag }}; done
      - name: Open VSX
        if: vars.PUBLISH_OPENVSX == 'true'
        run: for f in out/packages/*.vsix; do npx --yes ovsx@1.3.0 publish "$f" --trusted-publishing ${{ steps.kind.outputs.flag }}; done
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" out/packages/*.vsix out/packages/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "Many Hats ${GITHUB_REF_NAME#v}"
          --notes-file out/packages/NOTES.md ${{ steps.kind.outputs.gh }}
